<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>drawing.art</title>
    <script>
      // Redirect to index.html for SPA routing on custom domain
      var l = window.location;
      // If not already at root, redirect to index.html
      if (l.pathname !== '/' && !l.pathname.endsWith('.html') && !l.pathname.endsWith('.js') && !l.pathname.endsWith('.css')) {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?path=' + encodeURIComponent(l.pathname));
      }
    </script>
  </head>
  <body>
  </body>
</html>
